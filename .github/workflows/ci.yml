name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9][0-9][0-9][0-9].[0-9][0-9].*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux-arm64:
    name: Tests and installer / ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qttest \
            fonts-dejavu-core netcat-openbsd
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Check assets
        run: node --test dev/test-assets.mjs
      - name: Run UI tests
        env:
          QT_DECLARATIVE_PREFIX: /usr/lib/qt6
          QMLTESTRUNNER: /usr/lib/qt6/bin/qmltestrunner
        run: ./dev/test-ui.sh
      - name: Build Linux service
        run: |
          docker build -t pimprobe-rust-builder packaging
          docker run --rm -v "$PWD:/src" pimprobe-rust-builder
      - name: Build and test plugins
        run: |
          docker build -t pimprobe-qt-builder plugins
          docker run --rm -v "$PWD/plugins:/src" pimprobe-qt-builder \
            cmake -S /src -B /src/build-arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release
          docker run --rm -v "$PWD/plugins:/src" pimprobe-qt-builder \
            cmake --build /src/build-arm64 --parallel 4
          docker run --rm -v "$PWD/plugins:/src" pimprobe-qt-builder \
            ctest --test-dir /src/build-arm64 --output-on-failure
      - name: Package and test installer
        run: |
          node --test dev/test-installer.mjs
          VERSION="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="$GITHUB_REF_NAME"; fi
          node dev/package.mjs --output dist/pimprobe-linux-arm64.run \
            --version "$VERSION" --commit "$GITHUB_SHA"
          sh dist/pimprobe-linux-arm64.run --check
          docker run --rm \
            -v "$PWD/dist/pimprobe-linux-arm64.run:/package.run:ro" \
            -v "$PWD/dev/test-install-container.sh:/test.sh:ro" \
            -v "$PWD/packaging/config.example.json:/expected-config.json:ro" \
            pimprobe-rust-builder sh /test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pimprobe-linux-arm64
          path: dist/pimprobe-linux-arm64.run
          if-no-files-found: error

  release-dev:
    name: Publish development release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: pimprobe-linux-arm64
          path: release-assets
      - name: Publish rolling development release
        run: |
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$REMOTE_MAIN" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale run for $GITHUB_SHA; main is now $REMOTE_MAIN"
            exit 0
          fi

          BASE="$(git tag --merged HEAD --list '????.??.*' | awk '/^[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$/' | sort -V | tail -1)"
          RANGE=HEAD
          if [[ -n "$BASE" ]]; then RANGE="$BASE..HEAD"; fi
          node dev/release-notes.mjs development "$RANGE" >release-notes.md
          printf '\nBuild commit: `%s`\n' "$GITHUB_SHA" >>release-notes.md
          ASSET="pimprobe-linux-arm64-${GITHUB_SHA::7}.run"
          cp release-assets/pimprobe-linux-arm64.run "release-assets/$ASSET"
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev "release-assets/$ASSET" --clobber
            gh release edit dev --title "Development Build" --notes-file release-notes.md \
              --draft=false --prerelease
            REMOTE_DEV="$(git ls-remote origin refs/tags/dev | cut -f1)"
            git tag --force dev "$GITHUB_SHA"
            git push --force-with-lease="refs/tags/dev:$REMOTE_DEV" origin refs/tags/dev
          else
            gh release create dev "release-assets/$ASSET" --title "Development Build" \
              --notes-file release-notes.md --draft --target "$GITHUB_SHA"
            gh release edit dev --draft=false --prerelease
          fi
          while IFS= read -r asset; do
            if [[ -n "$asset" && "$asset" != "$ASSET" ]]; then
              gh release delete-asset dev "$asset" --yes
            fi
          done < <(gh release view dev --json assets --jq '.assets[].name')

  release-stable:
    name: Publish stable release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v5
        with:
          name: pimprobe-linux-arm64
          path: release-assets
      - name: Validate tag and publish release
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^([0-9]{4})\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable release tag: $TAG" >&2
            exit 1
          fi
          SEQUENCE="${BASH_REMATCH[3]}"
          if (( SEQUENCE > 0 )); then
            PREVIOUS_MONTHLY="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((SEQUENCE - 1))"
            git rev-parse -q --verify "refs/tags/$PREVIOUS_MONTHLY" >/dev/null || {
              echo "Missing preceding monthly release $PREVIOUS_MONTHLY" >&2
              exit 1
            }
          fi
          PREVIOUS="$(git tag --merged "$GITHUB_SHA^" --list '????.??.*' | awk '/^[0-9]{4}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$/' | sort -V | tail -1)"
          RANGE=HEAD
          if [[ -n "$PREVIOUS" ]]; then RANGE="$PREVIOUS..HEAD"; fi
          node dev/release-notes.mjs stable "$RANGE" >release-notes.md
          ASSET="pimprobe-linux-arm64-$TAG.run"
          cp release-assets/pimprobe-linux-arm64.run "release-assets/$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "release-assets/$ASSET" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md \
              --draft=false
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md \
              --verify-tag --draft "release-assets/$ASSET"
            gh release edit "$TAG" --draft=false
          fi
          while IFS= read -r asset; do
            if [[ -n "$asset" && "$asset" != "$ASSET" ]]; then
              gh release delete-asset "$TAG" "$asset" --yes
            fi
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
