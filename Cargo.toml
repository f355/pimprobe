[workspace]
members = ["crates/probe-core", "crates/controller", "crates/service"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
async-trait = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
