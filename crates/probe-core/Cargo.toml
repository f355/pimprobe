[package]
name = "pimprobe-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "pimprobe_core"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
thiserror = "2"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
